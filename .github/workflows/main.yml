name: getinform.py

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      ONETRUST_TOKEN: ${{ secrets.ONETRUST_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Python Package
        run: pip install requests

      - name: Run Script
        run: python getinform.py
